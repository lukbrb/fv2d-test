name: Lint
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format, clang-tidy, cppcheck
        run: |
          sudo apt-get install -y clang-format clang-tidy cppcheck

      - name: Run clang-format
        continue-on-error: true
        run: |
          find . -name "*.cpp" -o -name "*.hpp" -name "*.h" | xargs clang-format --dry-run --Werror || echo "clang-format failed but continuing..."

      - name: Run clang-tidy
        continue-on-error: true
        run: |
          # Exemple pour un fichier spécifique, à adapter selon ta structure
          # Utilise une boucle pour tous les fichiers .cpp si nécessaire
          for file in $(find . -name "*.cpp"); do
            clang-tidy $file --checks=-*,modernize-*,clang-analyzer-* -warnings-as-errors=* || echo "clang-tidy failed on $file but continuing..."
          done

      - name: Run cppcheck
        continue-on-error: true
        run: |
          cppcheck --enable=all --inconclusive --std=c++17 src/ || echo "cppcheck failed but continuing..."
